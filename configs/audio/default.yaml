# Runtime command templates for local/HPC audio engines.
# The package can dry-run without these engines installed.
voice_backend: f5_tts
music_backend: musicgen
aligner_backend: whisperx

mix:
  sample_rate: 48000
  target_lufs: -15.0
  true_peak_db: -1.5
  duration_tolerance_ms: 250
  line_boundary_tolerance_ms: 350
  max_time_stretch_percent: 8

backends:
  f5_tts:
    kind: voice
    command: >-
      f5-tts_infer-cli --ref_audio '${ref_audio}' --ref_text '${ref_text}'
      --gen_text '${text}' --output_file '${output_file}'
  cosyvoice:
    kind: voice
    command: >-
      python engines/cosyvoice_infer.py --text '${text}' --style '${voice_style}'
      --output '${output_file}'
  musicgen:
    kind: music
    command: >-
      python engines/musicgen_infer.py --prompt '${music_prompt}'
      --duration ${duration} --output '${output_file}'
  ace_step_full_song:
    kind: song
    command: >-
      python engines/acestep_song.py --lyrics-file '${lyrics_file}'
      --prompt-file '${prompt_file}' --duration ${duration} --output '${output_file}'
  yue_full_song:
    kind: song
    command: >-
      python engines/yue_song.py --genre-txt '${genre_file}'
      --lyrics-txt '${lyrics_file}' --output-dir '${output_dir}'
  whisperx:
    kind: aligner
    command: >-
      whisperx '${audio_file}' --model small --language en --output_dir '${output_dir}'
